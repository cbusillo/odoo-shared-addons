name: Addon tests

on:
  pull_request:
  push:
    branches: [main, 'launchplane/train/**']
permissions:
  contents: read

concurrency:
  group: addon-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  addon-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false
      - uses: cbusillo/odoo-devkit/.github/actions/addon-tests@8dd691e8bd48222dd202c0b334a0d819d1c90935
        with:
          command-metadata: source/.github/github.json
          addons-root: source
          image: ghcr.io/cbusillo/odoo-docker@sha256:ddbddb4a0ae81f679f1e4f4276611a9b3dbe86917e1207c0c5aef686867c17fa
          output: ${{ runner.temp }}/addon-tests
      - name: Upload addon test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-test-evidence
          path: ${{ runner.temp }}/addon-tests
          if-no-files-found: warn

