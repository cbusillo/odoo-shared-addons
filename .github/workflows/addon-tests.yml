name: Addon tests

on:
  pull_request:
  push:
    branches: [main, 'launchplane/train/**']
permissions:
  contents: read

concurrency:
  group: addon-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  addon-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false
      - uses: cbusillo/odoo-devkit/.github/actions/addon-tests@d6cbec387daf5d08ed73f99f3ab28882c3e6f352
        with:
          command-metadata: source/.github/github.json
          addons-root: source
          image: ghcr.io/cbusillo/odoo-docker@sha256:c3c1b3f0dac573763dbab2d38f9643b28a45c3faab6a2e6314eda35307812486
          output: ${{ runner.temp }}/addon-tests
      - name: Upload addon test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-test-evidence
          path: ${{ runner.temp }}/addon-tests
          if-no-files-found: warn

