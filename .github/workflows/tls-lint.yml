name: TLS lint

on:
  pull_request:
  push:
    branches: [main, 'launchplane/train/**']
permissions:
  contents: read
jobs:
  tls-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check TLS rules
        run: |
          tls_command=$(jq -er '.qualityGate.lint.tls' .github/github.json)
          bash -euo pipefail -c "$tls_command"
